# English messages. Every user-facing string lives here. MiniMessage format.
# Placeholders use <name> and are provided by the code.

general:
  players-only: "<red>This command can only be used by players."
  no-permission: "<red>You don't have permission to do that."
  reloaded: "<green>Configuration and language files reloaded."
  unknown-command: "<red>Unknown command. Use <yellow>/skills help</yellow>."

help:
  header: "<gray>--- <white>Skills</white> ---"
  entries:
    - "<yellow>/skills help</yellow> <gray>- show this help"
    - "<yellow>/skills class</yellow> <gray>- show your class, level and XP"
    - "<yellow>/skills class remove</yellow> <gray>- forget your class"
    - "<yellow>/skills minigame <id></yellow> <gray>- play a minigame"
    - "<yellow>/skills scroll [class]</yellow> <gray>- get a class scroll (admin)"
    - "<yellow>/skills set <class> [player]</yellow> <gray>- assign a class (admin)"
    - "<yellow>/skills addxp <amount> [player]</yellow> <gray>- grant XP (admin)"
    - "<yellow>/skills particles [on|off]</yellow> <gray>- toggle warrior stance particles"
    - "<yellow>/skills reload</yellow> <gray>- reload config and language (admin)"

# Display names for classes (user-facing, MiniMessage).
class-names:
  example: "<gold>Vanguard</gold>"
  blacksmith: "<gradient:#d98032:#f5c542>Blacksmith</gradient>"
  hunter: "<gradient:#3a7d34:#8fd14f>Hunter</gradient>"
  thief: "<gradient:#5a4b81:#9b8cc4>Thief</gradient>"
  warrior: "<gradient:#c1121f:#f08a5d>Warrior</gradient>"

class:
  none: "<gray>You have no class. Use a Scroll to choose one."
  info: "<white>Class: <yellow><class></yellow> <gray>| Level <yellow><level></yellow> <gray>| XP <yellow><xp></yellow>/<yellow><next></yellow>"
  assigned: "<green>You are now a <yellow><class></yellow>!"
  removed: "<green>Your class has been removed."
  unknown: "<red>No class with id <yellow><id></yellow>."
  already: "<gray>You are already a <yellow><class></yellow>."
  xp-added: "<green>Added <yellow><amount></yellow> XP."
  level-up: "<gold>Level up! <yellow><class></yellow> is now level <yellow><level></yellow>."
  max-level: "<gold>You have reached the maximum level."

scroll:
  received: "<green>You received a <yellow><class></yellow> scroll."
  used: "<green>The scroll dissolves as you learn the <yellow><class></yellow> path."

# Blacksmith crafting / modifier system.
smithing:
  master-locked: "<red>Only a level <yellow><level></yellow> blacksmith can forge <yellow><tier></yellow> gear."
  craft-one-at-a-time: "<red>Forge one piece at a time."
  modifier-applied: "<green>Your work pays off — <name> <green>quality!"
  no-modifier: "<gray>A clean piece — no special quality this time."
  debuff-applied: "<red>Shoddy work — it came out <name><red>."
  reroll-need-level: "<red>Rerolling needs a level <yellow><level></yellow> blacksmith."
  reroll-limit: "<red>This item has been reforged the maximum <yellow><max></yellow> times."
  reroll-done: "<green>Reforged into <name> <green>quality!"
  fix-need-level: "<red>Fixing debuffs needs a level <yellow><level></yellow> blacksmith."
  fix-done: "<green>You hammer out the flaws — the debuff is gone."
  # Lore line shown on modified gear. <name> = proxy name, <tier> = star rating.
  modifier-lore: "<gray><name> <dark_gray><tier>"

# Hunter bow/crossbow crafting and reforging.
hunter:
  craft-one-at-a-time: "<red>Craft one bow at a time."
  modifier-applied: "<green>A fine draw — <name> <green>quality!"
  no-modifier: "<gray>A plain bow — no special quality this time."
  debuff-applied: "<red>Clumsy work — it came out <name><red>."
  reroll-need-level: "<red>Reforging bows needs a level <yellow><level></yellow> hunter."
  reroll-need-materials: "<red>You need <yellow><cost></yellow> to reforge this at the archer table."
  reroll-limit: "<red>This bow has been reforged the maximum <yellow><max></yellow> times."
  reroll-done: "<green>Reforged into <name> <green>quality! <gray>(<yellow><left></yellow> left)"

# Thief abilities.
thief:
  lockpick-not-thief: "<red>You don't know how to use a lockpick."
  lockpick-no-target: "<gray>There's no one here worth stealing from."
  lockpick-cooldown: "<red>Your hands are still shaking — wait <yellow><seconds></yellow>s."
  lockpick-failed: "<red>The lock holds. Your pick slips."
  lockpick-success: "<green>The lock clicks open."
  lockpick-unavailable: "<red>Your lockpick won't budge right now."
  pickpocket-cooldown: "<red>Too soon — wait <yellow><seconds></yellow>s."
  pickpocket-unavailable: "<red>You can't focus on their pockets right now."
  pickpocket-menu-title: "Pickpocketing <player>"
  pickpocket-failed: "<red>Your fingers come up empty."
  pickpocket-empty: "<gray>They have nothing to take."
  pickpocket-success: "<green>You lift <yellow><amount></yellow>x <white><item></white>."
  pickpocket-caught: "<red><thief> just tried to pickpocket you!"
  pickpocket-victim: "<red>You feel lighter — something is missing."
  smoke-deployed: "<dark_gray>You vanish in a cloud of smoke."
  smoke-cooldown: "<red>Your smoke bomb isn't ready — wait <yellow><seconds></yellow>s."

# Warrior stances, combat rolls and war cries.
warrior:
  # Stance display names. Override the `name` in stances/<id>.yml; keep the ids in sync with it.
  stance-names:
    neutral: "<gray>Free</gray>"
    onslaught: "<color:#C1121F>Onslaught</color>"
    guard: "<color:#4A6FA5>Guard</color>"
    skirmish: "<color:#3FA34D>Skirmish</color>"
    phalanx: "<color:#C89B3C>Phalanx</color>"
    cleave: "<color:#E07A1F>Cleave</color>"
    sunder: "<color:#6A3FA0>Sunder</color>"
    riposte: "<color:#DCDCDC>Riposte</color>"
  warcry-names:
    roar: "Roar"
    hold: "Hold the Line"
    dash: "Dash"
    spear: "Spears Forward"
    whirlwind: "Whirlwind"
    quake: "Earthquake"
    challenge: "Challenge"
  stance-changed: "<green>Stance: <yellow><stance></yellow>."
  stance-warmup: "<gray>Settling into <yellow><stance></yellow>..."
  stance-interrupted: "<red>The blow breaks your footing — the switch is cancelled."
  stance-cooldown: "<red>Not yet — wait <yellow><seconds></yellow>s before switching again."
  stance-locked: "<red><stance> <red>needs a level <yellow><level></yellow> warrior."
  stance-blocked: "<red><stance> <red>is not allowed here."
  stance-wrong-weapon: "<red>The wrong weapon for <stance><red>."
  stance-none: "<gray>Nothing else to switch to with this weapon."
  # Action bar cues. These are the visual half of every roll — the sound is the other half.
  hud: "<gray>[<yellow><stance><gray>] <dark_gray><bar>"
  hud-suspended: "<dark_gray>[<gray><stance><dark_gray>] <dark_gray><bar>"
  parry: "<white>Parried!"
  glance: "<gray>Glancing blow."
  riposte: "<white>Riposte!"
  stun: "<gold>Stunned!"
  warcry-used: "<gold><cry>!"
  warcry-none: "<gray>This stance has nothing to shout about."
  warcry-cooldown: "<red>Your voice is spent — wait <yellow><seconds></yellow>s."
  warcry-fervor: "<red>Not enough Fervor — you need <yellow><fervor></yellow>."
  menu-title: "Stances"
  menu-active: "<green>Active"
  menu-available: "<gray>Click to switch"
  menu-locked: "<red>Unlocks at level <level>"
  menu-wrong-weapon: "<red>Wrong weapon in hand"
  particles-on: "<green>Warrior particles enabled."
  particles-off: "<gray>Warrior particles disabled. Sound cues stay on."

minigame:
  unknown: "<red>No minigame with id <yellow><id></yellow>. Available: <list>."
  already-running: "<red>You are already in a minigame."
  starting: "<aqua>Minigame <yellow><game></yellow> starting..."
  win: "<green>You won! Score: <yellow><score></yellow>."
  lose: "<red>You lost. Score: <yellow><score></yellow>."
  typing-prompt: "<aqua>Type this word: <yellow><word></yellow>"
  typing-timeout: "<red>Too slow!"
  clicking-prompt: "<aqua>Left-click as fast as you can for <yellow><seconds></yellow>s!"
  clicking-progress: "<gray>Clicks: <yellow><clicks></yellow>/<target>"
  rhythm-prompt: "<aqua>Press <yellow>SPACE</yellow> when the marker is on the green zone!"
  rhythm-hit: "<green>Perfect!"
  rhythm-miss: "<red>Off-beat!"
  sequence-prompt: "<aqua>Memorize the sequence, then repeat it by left-clicking."
  sequence-show: "<yellow><sequence></yellow>"
  sequence-your-turn: "<aqua>Your turn! Repeat the sequence."
  sequence-wrong: "<red>Wrong! The sequence broke."
