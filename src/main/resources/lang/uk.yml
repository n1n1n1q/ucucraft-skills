# Українська локалізація. Формат MiniMessage. Плейсхолдери <name> надає код.

general:
  players-only: "<red>Цю команду можуть використовувати лише гравці."
  no-permission: "<red>У вас немає прав на цю дію."
  reloaded: "<green>Конфігурацію та мовні файли перезавантажено."
  unknown-command: "<red>Невідома команда. Використайте <yellow>/skills help</yellow>."

# /damage — адмінський показ підсумкової шкоди кожного вашого удару.
damage:
  on: "<green>Показ шкоди увімкнено."
  off: "<gray>Показ шкоди вимкнено."
  hit: "<gray>Удар по <white><target></white> — <red><damage></red>"

help:
  header: "<gray>--- <white>Класи</white> ---"
  entries:
    - "<yellow>/skills help</yellow> <gray>- показати цю довідку"
    - "<yellow>/skills class</yellow> <gray>- показати клас, рівень і досвід"
    - "<yellow>/skills class remove</yellow> <gray>- забути клас"
    - "<yellow>/skills minigame <id></yellow> <gray>- зіграти в міні-гру"
    - "<yellow>/skills scroll [class]</yellow> <gray>- отримати сувій класу (адмін)"
    - "<yellow>/skills set <class> [player]</yellow> <gray>- призначити клас (адмін)"
    - "<yellow>/skills addxp <amount> [player]</yellow> <gray>- видати досвід (адмін)"
    - "<yellow>/skills particles [on|off]</yellow> <gray>- перемкнути частинки стійок воїна"
    - "<yellow>/skills reload</yellow> <gray>- перезавантажити конфіг і мову (адмін)"

# Відображувані назви класів (для гравців, MiniMessage).
class-names:
  example: "<gold>Авангард</gold>"
  blacksmith: "<gradient:#d98032:#f5c542>Ремісник</gradient>"
  hunter: "<gradient:#3a7d34:#8fd14f>Мисливець</gradient>"
  thief: "<gradient:#5a4b81:#9b8cc4>Злодій</gradient>"
  warrior: "<gradient:#c1121f:#f08a5d>Воїн</gradient>"
  runesmith: "<gradient:#8e6bd6:#43c6e0>Рунар</gradient>"

class:
  none: "<gray>У вас немає класу. Використайте Сувій, щоб обрати."
  info: "<white>Клас: <yellow><class></yellow> <gray>| Рівень <yellow><level></yellow> <gray>| Досвід <yellow><xp></yellow>/<yellow><next></yellow>"
  assigned: "<green>Тепер ви <yellow><class></yellow>!"
  removed: "<green>Ваш клас знято."
  unknown: "<red>Немає класу з id <yellow><id></yellow>."
  already: "<gray>Ви вже <yellow><class></yellow>."
  xp-added: "<green>Додано <yellow><amount></yellow> досвіду."
  level-up: "<gold>Новий рівень! <yellow><class></yellow> тепер рівня <yellow><level></yellow>."
  max-level: "<gold>Ви досягли максимального рівня."

scroll:
  received: "<green>Ви отримали сувій класу <yellow><class></yellow>."
  used: "<green>Сувій розчиняється, і ви опановуєте шлях <yellow><class></yellow>."

# Ковальство / система модифікаторів.
smithing:
  master-locked: "<red>Лише ремісник <yellow><level></yellow> рівня може кувати <yellow><tier></yellow> спорядження."
  craft-one-at-a-time: "<red>Куй по одному предмету за раз."
  modifier-applied: "<green>Праця не марна — якість <name><green>!"
  no-modifier: "<gray>Чистий виріб — цього разу без особливої якості."
  debuff-applied: "<red>Недбала робота — вийшло <name><red>."
  reroll-need-level: "<red>Перековка потребує ремісника <yellow><level></yellow> рівня."
  reroll-limit: "<red>Цей предмет перековано максимальну кількість разів (<yellow><max></yellow>)."
  reroll-done: "<green>Перековано в якість <name><green>!"
  fix-need-level: "<red>Виправлення дефектів потребує ремісника <yellow><level></yellow> рівня."
  fix-done: "<green>Ви вибиваєте вади — дебаф зникає."
  # Рядок опису на модифікованому спорядженні. <name> = назва, <tier> = зірки.
  modifier-lore: "<gray><name> <dark_gray><tier>"

# Крафт і перековка луків/арбалетів мисливцем.
hunter:
  craft-one-at-a-time: "<red>Роби по одному луку за раз."
  modifier-applied: "<green>Влучний постріл — якість <name><green>!"
  no-modifier: "<gray>Звичайний лук — цього разу без особливої якості."
  debuff-applied: "<red>Незграбна робота — вийшло <name><red>."
  reroll-need-level: "<red>Перековка луків потребує мисливця <yellow><level></yellow> рівня."
  reroll-need-materials: "<red>Потрібно <yellow><cost></yellow>, щоб перекувати це за столом лучника."
  reroll-limit: "<red>Цей лук перековано максимальну кількість разів (<yellow><max></yellow>)."
  reroll-done: "<green>Перековано в якість <name> <green>! <gray>(залишилось <yellow><left></yellow>)"
  steady-charging: "<gray>Прицілювання… <green><bar>"
  steady-ready: "<gold>◈ Точний постріл готовий ◈"
  steady-fired: "<green>Прицільний постріл!"

# Здібності злодія.
thief:
  lockpick-not-thief: "<red>Ви не вмієте користуватися відмичкою."
  lockpick-no-target: "<gray>Тут немає в кого красти."
  lockpick-cooldown: "<red>Руки ще тремтять — зачекайте <yellow><seconds></yellow>с."
  lockpick-failed: "<red>Замок не піддається. Відмичка зісковзує."
  lockpick-success: "<green>Замок клацає і відчиняється."
  lockpick-unavailable: "<red>Відмичка зараз не діє."
  pickpocket-cooldown: "<red>Занадто рано — зачекайте <yellow><seconds></yellow>с."
  pickpocket-unavailable: "<red>Зараз не вдається зосередитись на їхніх кишенях."
  pickpocket-menu-title: "Обкрадання <player>"
  pickpocket-failed: "<red>Ваші пальці лишились ні з чим."
  pickpocket-too-far: "<red>Вони вислизнули з-під рук."
  pickpocket-empty: "<gray>У них нічого взяти."
  pickpocket-success: "<green>Ви поцупили <yellow><amount></yellow>x <white><item></white>."
  pickpocket-caught: "<red><thief> щойно намагався вас обікрасти!"
  pickpocket-victim: "<red>Вам полегшало — щось зникло."
  smoke-deployed: "<dark_gray>Ви зникаєте в хмарі диму."
  smoke-cooldown: "<red>Димова бомба ще не готова — зачекайте <yellow><seconds></yellow>с."

# Стійки, бойові кидки та бойові кличі воїна.
warrior:
  # Назви стійок. Перекривають `name` у stances/<id>.yml; id мають збігатися.
  stance-names:
    neutral: "<gray>Вільна</gray>"
    onslaught: "<color:#C1121F>Наступ</color>"
    guard: "<color:#4A6FA5>Оборона</color>"
    skirmish: "<color:#3FA34D>Натиск</color>"
    phalanx: "<color:#C89B3C>Стіна</color>"
    cleave: "<color:#E07A1F>Розкол</color>"
    sunder: "<color:#6A3FA0>Злам</color>"
    riposte: "<color:#DCDCDC>Відповідь</color>"
  warcry-names:
    roar: "Рев"
    hold: "Стійте!"
    dash: "Ривок"
    spear: "Спис вперед"
    whirlwind: "Вихор"
    quake: "Землетрус"
    challenge: "Виклик"
  stance-changed: "<green>Стійка: <yellow><stance></yellow>."
  stance-warmup: "<gray>Переходите в <yellow><stance></yellow>..."
  stance-interrupted: "<red>Удар збиває вас — перехід скасовано."
  stance-cooldown: "<red>Ще ні — зачекайте <yellow><seconds></yellow>с до наступної зміни."
  stance-locked: "<red><stance> <red>потребує воїна <yellow><level></yellow> рівня."
  stance-blocked: "<red><stance> <red>тут заборонена."
  stance-wrong-weapon: "<red>Не та зброя для <stance><red>."
  stance-none: "<gray>З цією зброєю більше нема на що перемикатись."
  # Заголовок бос-бару, поки в руці холодна зброя; заповнення смуги — частка Запалу.
  # Візуальна половина кожного кидка; друга половина це звук.
  hud: "<yellow><stance></yellow> <dark_gray>·</dark_gray> <gold>Запал <white><fervor>"
  hud-suspended: "<gray><stance> <dark_gray>·</dark_gray> <gold>Запал <gray><fervor> <dark_gray>(призупинено)"
  # Показується на смузі боса, поки бойовий клич відновлюється; заповнення = залишок перезарядки.
  hud-cooldown: "<aqua><stance></aqua> <dark_gray>·</dark_gray> <aqua>Клич <white><seconds>с"
  parry: "<white>Парирування!"
  glance: "<gray>Ковзнув повз!"
  riposte: "<white>Відповідь!"
  stun: "<gold>Оглушено!"
  # Двобій бойового кличу «Виклик». <seconds>/<opponent>; <mine>/<theirs> — рахунок завданої шкоди.
  duel-start: "<gold>Двобій! <yellow><opponent></yellow> <dark_gray>·</dark_gray> <white><seconds>с"
  duel-bar: "<gold>Двобій <white><seconds>с <dark_gray>·</dark_gray> <red><mine></red> проти <blue><theirs></blue>"
  duel-win: "<gold>Ви перемогли у двобої з <yellow><opponent></yellow>!"
  duel-loss: "<gray>Ви програли двобій <yellow><opponent></yellow>."
  duel-draw: "<gray>Ваш двобій з <yellow><opponent></yellow> завершився внічию."
  duel-no-target: "<gray>Поруч нема кого викликати."
  warcry-used: "<gold>Ви видаєте <yellow><cry></yellow>!"
  warcry-broadcast: "<gold><player> видає <yellow><cry></yellow>!"
  warcry-none: "<gray>Цій стійці нема чого кричати."
  warcry-locked: "<red>Бойові кличі потребують воїна <yellow><level></yellow> рівня."
  warcry-cooldown: "<red>Голос сів — зачекайте <yellow><seconds></yellow>с."
  warcry-fervor: "<red>Замало Запалу — потрібно <yellow><fervor></yellow>."
  particles-on: "<green>Частинки воїна увімкнено."
  particles-off: "<gray>Частинки воїна вимкнено. Звукові підказки лишаються."

