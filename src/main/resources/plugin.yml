name: UcucraftSkills
version: '${version}'
main: com.ucucraft.skills.SkillsPlugin
api-version: '1.21'
authors: [ucucraft]
description: Classes/specialties, level progression and minigames.
# Optional integrations. The plugin runs without them; thief lockpicking uses both when present.
softdepend: [Countries, UcucraftItems]

commands:
  skills:
    description: Manage classes, scrolls and minigames.
    usage: /skills help
    aliases: [sk, class]
  damage:
    description: Toggle a readout of the damage each of your hits deals (admin).
    usage: /damage [on|off]
    permission: skills.admin

permissions:
  skills.use:
    description: Use basic player commands.
    default: true
  skills.admin:
    description: Grant classes, give scrolls, run admin commands.
    default: op
  skills.enchanting.bypass:
    description: Skip the vanilla enchant-level cap (EnchantmentGate) everywhere it applies.
    default: op
