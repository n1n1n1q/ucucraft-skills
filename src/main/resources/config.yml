# UcucraftSkills configuration. Everything tunable lives here.

# Prefix prepended to every plugin message. MiniMessage format.
prefix: "<gradient:#7f5af0:#2cb67d>[Skills]</gradient> "

# Active language file under lang/<locale>.yml
locale: en

storage:
  # Only "yaml" is implemented. Interface allows adding "sqlite"/"mysql" later.
  type: yaml

# Default level-progression curve, used unless a class overrides it.
# xpForLevel(n) = base * (multiplier ^ (n - 1))
progression:
  base-xp: 100
  multiplier: 1.35
  max-level: 50

# The specialty scroll item.
scroll:
  material: PAPER
  # MiniMessage. <class> is replaced with the target class display name.
  name: "<gradient:#7f5af0:#2cb67d>Scroll of <class></gradient>"
  glow: true
  # Class id granted when the scroll is used. Must match a registered class id.
  grants: example

# Per-class tuning. Classes are registered in code but read their numbers here.
classes:
  example:
    # Attribute bonus scaling per level (Paper attribute id -> per-level amount).
    max-health-per-level: 1.0
    # Accessibility bonus: alternative visual cue strength (0 disables).
    # Compensates players who cannot rely on sound cues.
    visual-cue-level: 1
  blacksmith:
    # Small passive; the class's real power is the crafting gates below.
    knockback-resistance-per-level: 0.0
    # MUST stay > 0: the forge uses the sound-based rhythm minigame, so a deaf
    # blacksmith needs the on-screen beat to compensate (see CLAUDE.md).
    visual-cue-level: 1

# Blacksmith crafting / Terraria-style modifier system.
smithing:
  enabled: true
  # Gold, diamond and rose gold gear need a blacksmith of at least this level.
  master-tiers:
    min-level: 3
  # Shift-right-click held gear to reroll (needs a modifier-free item) or fix a debuff.
  reroll:
    min-level: 2
    max-rerolls: 5
  fix:
    min-level: 1
  # Regular (non-blacksmith) crafters of iron/chainmail gear.
  regular:
    debuff-chance: 0.5
    max-debuff-tier: 2
  # Per-level luck. Level is the blacksmith's class level, clamped to 1..4.
  # base-chance + hit-bonus * (hits / beats) = chance of ANY modifier; the rest is
  # a clean item (no modifier, no debuff). tier-weights pick tier 1..max-tier.
  levels:
    1: { max-tier: 2, base-chance: 0.20, hit-bonus: 0.30, tier-weights: [72, 25, 3, 0] }
    2: { max-tier: 2, base-chance: 0.30, hit-bonus: 0.35, tier-weights: [55, 35, 10, 0] }
    3: { max-tier: 3, base-chance: 0.45, hit-bonus: 0.40, tier-weights: [40, 35, 20, 5] }
    4: { max-tier: 4, base-chance: 0.60, hit-bonus: 0.45, tier-weights: [25, 35, 25, 15] }

crafting:
  # Detect ucucraft-items rose gold via its item-id PDC (soft dependency; no hard link).
  rose-gold:
    namespace: ucucraftitems
    key: item_id
    id-prefix: rose_gold
  # Non-masters are forced onto these when crafting iron armor: one ingot (I) is swapped for a
  # block (B) — "they tend to create shit". Blacksmiths keep the vanilla ingot recipes. Only pieces
  # listed here are gated; remove one and that piece stays vanilla for everyone. I = IRON_INGOT,
  # B = IRON_BLOCK.
  harder-recipes:
    iron_helmet:
      enabled: true
      result: { material: IRON_HELMET, amount: 1 }
      shape:
        - "IBI"
        - "I I"
        - "   "
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK
    iron_chestplate:
      enabled: true
      result: { material: IRON_CHESTPLATE, amount: 1 }
      shape:
        - "I I"
        - "IBI"
        - "III"
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK
    iron_leggings:
      enabled: true
      result: { material: IRON_LEGGINGS, amount: 1 }
      shape:
        - "IBI"
        - "I I"
        - "I I"
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK
    iron_boots:
      enabled: true
      result: { material: IRON_BOOTS, amount: 1 }
      shape:
        - "I I"
        - "IBI"
        - "   "
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK

minigames:
  speed-typing:
    duration-seconds: 10
    words: [redstone, diamond, creeper, enchant, obsidian, netherite]
  speed-clicking:
    duration-seconds: 5
    target-clicks: 30
  rhythm:
    # Milliseconds between beats and the hit tolerance window.
    beat-interval-ms: 800
    tolerance-ms: 200
    beats: 8
    # Sound played on each beat (deaf players are disadvantaged here by design).
    # Namespaced sound key.
    sound: "minecraft:block.note_block.pling"
  sequence-memory:
    start-length: 3
    max-length: 8
    show-ms: 600
