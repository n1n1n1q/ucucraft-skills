# UcucraftSkills configuration. Everything tunable lives here.

# Prefix prepended to every plugin message. MiniMessage format.
prefix: "<gradient:#7f5af0:#2cb67d>[Skills]</gradient> "

# Active language file under lang/<locale>.yml
locale: en

storage:
  # Only "yaml" is implemented. Interface allows adding "sqlite"/"mysql" later.
  type: yaml

# Default level-progression curve, used unless a class overrides it.
# xpForLevel(n) = base * (multiplier ^ (n - 1))
progression:
  base-xp: 100
  multiplier: 1.35
  max-level: 50

# The specialty scroll item.
scroll:
  material: PAPER
  # MiniMessage. <class> is replaced with the target class display name.
  name: "<gradient:#7f5af0:#2cb67d>Scroll of <class></gradient>"
  glow: true
  # Class id granted when the scroll is used. Must match a registered class id.
  grants: example

# Per-class tuning. Classes are registered in code but read their numbers here.
classes:
  example:
    # Attribute bonus scaling per level (Paper attribute id -> per-level amount).
    max-health-per-level: 1.0
    # Accessibility bonus: alternative visual cue strength (0 disables).
    # Compensates players who cannot rely on sound cues.
    visual-cue-level: 1
  blacksmith:
    # Small passive; the class's real power is the crafting gates below.
    knockback-resistance-per-level: 0.0
    # Accessibility bonus (0 disables). The forge's rhythm minigame is fully visual now, but this
    # stays as the hook for any sound-based cue a class should compensate for (see CLAUDE.md).
    visual-cue-level: 1
  hunter:
    # Small passive movement speed per level (added to the 0.1 vanilla base).
    movement-speed-per-level: 0.0
    # Accessibility bonus (0 disables). The level-2 slow arrow plays a sound cue; a non-hearing
    # hunter can compensate through this. Hunter crafting/reforging has no minigame.
    visual-cue-level: 1
  warrior:
    # The warrior has no flat passive at all: everything it gets comes from its stance.
    # Accessibility bonus (0 disables). War cries are loud, so keep this above 0 — every warrior
    # roll is announced visually as well (see CLAUDE.md).
    visual-cue-level: 1
  runesmith:
    # No flat passive either — carving and the enchant gate are the whole class (see the `runes`
    # package). Accessibility bonus (0 disables). Resonance procs have a sound cue, so keep this
    # above 0 (see CLAUDE.md).
    visual-cue-level: 1

# Blacksmith crafting / Terraria-style modifier system.
smithing:
  enabled: true
  # Gold, diamond and rose gold gear need a blacksmith of at least this level.
  master-tiers:
    min-level: 3
  # Shift-right-click held gear to reroll (needs a modifier-free item) or fix a debuff.
  reroll:
    min-level: 2
    max-rerolls: 5
  fix:
    min-level: 1
  # Regular (non-blacksmith) crafters of iron/chainmail gear.
  regular:
    debuff-chance: 0.5
    max-debuff-tier: 2
  # Per-level luck. Level is the blacksmith's class level, clamped to 1..4.
  # base-chance + hit-bonus * (hits / beats) = chance of ANY modifier; the rest is
  # a clean item (no modifier, no debuff). tier-weights pick tier 1..max-tier.
  levels:
    1: { max-tier: 2, base-chance: 0.20, hit-bonus: 0.30, tier-weights: [72, 25, 3, 0] }
    2: { max-tier: 2, base-chance: 0.30, hit-bonus: 0.35, tier-weights: [55, 35, 10, 0] }
    3: { max-tier: 3, base-chance: 0.45, hit-bonus: 0.40, tier-weights: [40, 35, 20, 5] }
    4: { max-tier: 4, base-chance: 0.60, hit-bonus: 0.45, tier-weights: [25, 35, 25, 15] }

# Hunter: bow/crossbow crafting modifiers + per-level ranged abilities.
hunter:
  enabled: true
  # Block used as the "archer table" for reforging bows (right-click it holding a bow).
  table-material: FLETCHING_TABLE
  # Reforge a bow at the archer table. Runs the rhythm minigame; odds scale with level below.
  reroll:
    min-level: 1
    max-rerolls: 5           # "durability" of remodifications, tracked per item
    # Materials consumed per reroll. "MATERIAL:amount".
    cost:
      - "STRING:2"
      - "FEATHER:1"
  # Regular (non-hunter) crafters of bows/crossbows.
  regular:
    debuff-chance: 0.5
    max-debuff-tier: 2
  # Per-level luck for a hunter's bow crafts/reforges (same shape as smithing.levels).
  levels:
    1: { max-tier: 2, base-chance: 0.20, hit-bonus: 0.30, tier-weights: [72, 25, 3, 0] }
    2: { max-tier: 2, base-chance: 0.30, hit-bonus: 0.35, tier-weights: [55, 35, 10, 0] }
    3: { max-tier: 3, base-chance: 0.45, hit-bonus: 0.40, tier-weights: [40, 35, 20, 5] }
    4: { max-tier: 4, base-chance: 0.60, hit-bonus: 0.45, tier-weights: [25, 35, 25, 15] }
  # Level 2 "slow arrow": a chance on each shot for extra damage + slowness, with cue + trail.
  arrow-slow:
    min-level: 2
    chance: 0.2
    damage-multiplier: 1.5
    slowness-seconds: 4
    slowness-amplifier: 1
    sound: "minecraft:block.glass.break"
    particle: SNOWFLAKE
  # Level 2 "highlight prey": sneak + right-click a bow to glow nearby mobs (and mark them as prey).
  highlight:
    min-level: 2
    radius: 16
    duration-seconds: 6
    cooldown-seconds: 8
    sound: "minecraft:entity.fox.sniff"
  # Level 3 crossbow mastery.
  crossbow:
    min-level: 3
    keep-loaded-chance: 0.25   # chance the crossbow stays loaded after firing
  # Level 3 steady aim: sneak and hold still with a bow/crossbow to charge a bonus shot.
  steady-aim:
    min-level: 3
    charge-seconds: 1.5        # time held still + sneaking before the next shot is focused
    damage-multiplier: 1.6     # damage multiplier applied to the focused shot on hit
    move-tolerance: 0.08       # blocks of movement allowed between checks before focus resets
    ready-sound: "minecraft:block.note_block.pling"  # paired with the action-bar cue (accessibility)
  # Level 4 consecutive-hit damage stacking.
  stacking:
    min-level: 4
    window-seconds: 4
    damage-per-stack: 1.0
    max-bonus: 6.0
  # Level 4 reward for killing highlighted prey.
  marked-kill:
    min-level: 4
    speed-seconds: 5
    speed-amplifier: 1
    regen-seconds: 5
    regen-amplifier: 1
    sound: "minecraft:entity.player.levelup"
    particle: TOTEM_OF_UNDYING

# Thief: lockpicking + stealth abilities. Uses the Countries and ucucraft-items plugins when present.
thief:
  enabled: true
  # Level 1: right-click a container with a lockpick to break in.
  lockpick:
    # Soft-dep identity of ucucraft-items' lockpick (its item-id PDC).
    namespace: ucucraftitems
    key: item_id
    id: lockpick
    # Only allow stealing when the chunk holds members of the owning country (Countries plugin).
    # When Countries is absent this check is skipped (any container is pickable).
    require-country-members: true
    # Minigame run to pick the lock; must be a registered minigame id
    # (typing | clicking | rhythm | sequence).
    minigame: sequence
    # Easier difficulty just for lockpicking — overrides the chosen minigame's own settings. Keys
    # match the picked minigame; these defaults suit "sequence" (a short 2->3 memory, shown longer).
    difficulty:
      start-length: 2
      max-length: 3
      show-ms: 1500
    # A LOUD sound plays at the start and end of lockpicking — the theft is meant to be risky.
    sound: "minecraft:block.chain.break"
    sound-volume: 4.0
    cooldown-seconds: 0
  # Level 2: fall control + backstab.
  fall:
    min-level: 2
    max-blocks: 15.0        # sneaking negates fall damage for falls up to this height
  backstab:
    min-level: 2
    multiplier: 1.5         # damage multiplier for a sneaking hit from behind
    rear-threshold: 0.2     # how far into the target's rear arc the attacker must be (0..1)
  # Level 3: pickpocket a nearby player. Success is decided by a minigame, not luck; on success the
  # thief picks one of a few random items from a menu, which is dropped to them.
  pickpocket:
    min-level: 3
    minigame: typing        # registered minigame id (typing | clicking | rhythm | sequence)
    choices: 5              # random victim items offered in the selection menu
    amount: 1               # size of the chosen stack that is taken
    max-distance: 4         # blocks: must stay this close to the victim; drift further and it fails
    cooldown-seconds: 10
    alert-on-fail: true     # tell the victim when a pickpocket fails
    alert-victim: true      # tell the victim when a pickpocket succeeds
  # Level 4: Smoke Screen (sneak + swap-hand / F).
  smoke:
    min-level: 4
    cooldown-seconds: 30
    radius: 6
    particle: CAMPFIRE_SIGNAL_SMOKE
    particle-count: 120
    sound: "minecraft:entity.tnt.primed"
    blindness-seconds: 4
    self-speed-seconds: 5
    self-speed-amplifier: 1   # amplifier 1 = Speed II
    invisibility-seconds: 5

# Warrior: stances. Every stance's own numbers live in its file under stances/<id>.yml — this block
# only holds what is shared between them.
warrior:
  enabled: true
  stance:
    switch-cooldown-seconds: 3
    # Telegraph before a switch takes effect. No bonuses at all during it, so you cannot flip into
    # `guard` mid-swing for free. 0 disables the telegraph entirely.
    warmup-ticks: 20
    cancel-warmup-on-damage: true
    reset-on-death: true
    # The switch cooldown is halved from this level and ignored from the next one.
    cooldown-halved-level: 3
    cooldown-free-level: 4
  combat:
    # Hard ceiling on glance/parry/stun, so a config typo cannot produce a 100% parry.
    max-roll-chance: 0.35
    # A glance is a defensive deflection: an incoming melee/projectile hit grazes the warrior for
    # `multiplier` of its damage. Its chance is the stance's own `glance-chance`. hud = the on-screen
    # action-bar cue; sound = the glance sound (warrior.sounds.glance). Turn either off.
    glance:
      multiplier: 0.5
      hud: true
      sound: true
    # Default reach of cleave/sunder splash when the stance does not set its own.
    splash-radius: 3.5
    parry:
      cooldown-seconds: 4
      fervor-gain: 15
      blocks-projectiles: false
      riposte-window-ticks: 40
      knockback: 0.6
    stun:
      # Players cannot truly be frozen server-side: they get Slowness 7 + Jump Boost 129 + Mining
      # Fatigue and their outgoing melee is cancelled. Keep the duration short — see docs/warrior.md.
      duration-ticks: 25
      cooldown-seconds: 8      # per attacking warrior
      immunity-seconds: 6      # per target, after a stun ends
      dr-window-seconds: 20
      dr-steps: [1.0, 0.5, 0.25, 0.0]
      min-fervor: 0            # 0 = no Fervor gate on stuns
      pvp-enabled: false       # stuns are a PvE tool until you have tuned them
      hud: true                # action-bar cue on the warrior when it lands a stun
      sound: true              # the stun sound (warrior.sounds.stun), on the target
    # The level-4 riposte war cry (Виклик) opens a formal duel with the nearest PLAYER. For its
    # duration both fighters deal and take only `outsider-damage-multiplier` to anyone outside the
    # duel (player-vs-player only — mobs are untouched); against each other damage is full and the
    # initiating warrior deals `warrior-damage-multiplier`. Whoever dealt more when the timer runs
    # out — or the survivor if one dies — wins; a tie is a draw. Only a WARRIOR win pays out:
    # `win-effects` (potion -> amplifier, 0 = level I) for `win-duration-seconds`. Both fighters see a
    # countdown boss bar and a gold particle aura only the two of them can see.
    duel:
      duration-seconds: 15
      warrior-damage-multiplier: 1.1
      outsider-damage-multiplier: 0.25
      win-duration-seconds: 20
      win-effects:
        strength: 0
        regeneration: 1
      bar-color: RED           # BLUE | GREEN | PINK | PURPLE | RED | WHITE | YELLOW
  fervor:
    enabled: true
    max: 100
    per-hit: 8
    decay-per-second: 4
    charge-threshold: 60
  particles:
    enabled: true
    # Also the warrior tick: Fervor decay and the stance re-check run on it.
    interval-ticks: 10
    view-distance: 32
    scale-with-fervor: true
  # HUD: the stance name + Fervor read-out, a third cue channel next to colour and shape. Shown as a
  # boss bar (its fill is the Fervor fraction) while a melee weapon is held; disabled while unarmed.
  hud:
    enabled: true
    boss-bar: true                  # false = fall back to the action bar
    boss-bar-color: YELLOW          # BLUE | GREEN | PINK | PURPLE | RED | WHITE | YELLOW
    boss-bar-charged-color: RED     # used once Fervor passes fervor.charge-threshold
    boss-bar-cooldown-color: BLUE   # used while a war cry is recharging (the bar shows the cooldown)
    boss-bar-overlay: PROGRESS      # PROGRESS | NOTCHED_6 | NOTCHED_10 | NOTCHED_12 | NOTCHED_20
  warcry:
    min-level: 4
    # The input is sneak + swap-hand (F): shout when a cry is ready, otherwise cycle stances.
    min-fervor: 30           # Fervor needed to shout at all
    spend-down-to: 0         # everything above this is spent; the effect scales with the amount
    min-scale: 0.5           # weakest a cry can come out at
    cooldown-seconds: 45
    radius: 8                # used when the stance's warcry block sets no radius
    knockback: 0.8
    debug: false             # true = trace the war-cry pipeline (which gate fails) to the console
  sounds:
    volume: 0.8
    switch: "minecraft:item.armor.equip_iron"
    warmup: "minecraft:block.note_block.hat"
    parry: "minecraft:item.shield.block"
    glance: "minecraft:entity.player.attack.weak"
    stun: "minecraft:block.anvil.land"
    warcry: "minecraft:entity.ravager.roar"
  # Levels unlock options, not numbers: magnitude scales the gain AND the cost of every stance.
  # `stances` decides which stance ids unlock at each level (overriding the file's own min-level).
  levels:
    1: { magnitude: 1.0, stances: [neutral, onslaught, guard] }
    2: { magnitude: 1.1, stances: [skirmish, phalanx] }
    3: { magnitude: 1.2, stances: [cleave, sunder, riposte] }
    4: { magnitude: 1.3, stances: [] }

# Global vanilla enchanting cap. Applies to everyone, everywhere vanilla can grant an enchantment;
# a rune is the only way past it (or to grant an enchant that ships at overrides: 0 below).
# See EnchantmentGate and docs/runesmith.md.
enchanting:
  enabled: true
  default-max-level: 2
  # Enchant id -> hard cap, overriding default-max-level. 0 = never appears outside a rune.
  overrides:
    mending: 0
    silk_touch: 0
    infinity: 0
  # Enchant ids that are hard-banned: unobtainable by ANY means, vanilla or rune. Unlike
  # overrides at 0 (still carveable as a rune), a banned enchant can never be carved either —
  # RunesmithManager refuses the carve/transfer outright. Empty by default; e.g. [sharpness].
  banned: []
  # Permission that skips the gate entirely (admin/creative testing).
  bypass-permission: "skills.enchanting.bypass"

# Runesmith: enchant carving via armor trims. See classes/impl/RunesmithClass.java and the `runes`
# package. One file per vanilla trim pattern lives under runes/ — a pattern with no file there is
# simply not a rune.
runes:
  enabled: true
  # Vanilla only allows one trim per item, and that's the balance lever: one rune per item.
  one-per-item: true
  # The 10 vanilla trim materials, mapped to 5 tiers. Freely remappable.
  materials:
    copper: 1
    iron: 1
    gold: 2
    lapis: 2
    redstone: 3
    amethyst: 3
    emerald: 4
    quartz: 4
    diamond: 5
    netherite: 5
  # Material tier -> the enchantment level a successful carve grants.
  tier-levels:
    1: 3
    2: 3
    3: 4
    4: 4
    5: 5
  minigame:
    # Registered minigame id run on every carve (the sequence-memory game).
    id: sequence
    # Optional per-carve override, same idea as thief.lockpick.difficulty; blank to use the
    # minigame's own minigames.sequence-memory settings.
    difficulty:
      start-length: 3
      max-length: 6
  # Per-level carve odds, same shape as smithing.levels. max-tier is the highest MATERIAL tier that
  # level may carve with (this is the ability table itself: 2/3/4/5). Losing the carve minigame
  # always fails the carve (curse). Winning it still rolls base-chance + hit-bonus * hitRatio (hits
  # vs the minigame's max score, exactly like smithing) for a WIN (full material level); missing
  # that roll on an otherwise-won minigame gives a PARTIAL (one level lower) instead.
  levels:
    1: { max-tier: 2, base-chance: 0.50, hit-bonus: 0.30 }
    2: { max-tier: 3, base-chance: 0.60, hit-bonus: 0.30 }
    3: { max-tier: 4, base-chance: 0.70, hit-bonus: 0.30 }
    4: { max-tier: 5, base-chance: 0.80, hit-bonus: 0.30 }
  # A failed carve consumes the material and slaps one of these on instead (picked at random).
  curse:
    enchantments: [binding_curse, vanishing_curse]
  # Level 2: weapons/tools/bows too (rendered as lore only — vanilla trims are armour-only).
  non-armor:
    min-level: 2
  # Level 2: duplicate a smithing template. "TYPE:amount" or "MATERIAL:amount".
  duplication:
    min-level: 2
    cost:
      - "EMERALD:3"
      - "DIAMOND:1"
    # Duplicating also spends a trim material (copper..netherite) from anywhere in the inventory,
    # same as a non-armor carve. Its tier (runes.materials) picks the ONE-TIME copy budget stamped
    # onto that exact template the first time it's duplicated (higher tier = more copies); every
    # later duplication of that same template just spends the budget down by one, regardless of
    # what material tier is used then. A resulting copy is flagged and can never be duplicated
    # itself (no chains), and the source is refused once its budget hits 0.
    max-copies:
      1: 5
      2: 4
      3: 3
      4: 2
      5: 1
  # Level 3: re-carve the same pattern with a better material, keeping the rune.
  max-upgrades: 3
  upgrade:
    min-level: 3
  # Level 3: move a rune from one item to another.
  transfer:
    min-level: 3
  # Level 3: strip a rune-curse. Vanilla grindstone can never do this on its own (EnchantmentGate).
  strip-curse:
    min-level: 3
  # Level 4 passive: a held runed item has a chance to act one level higher. Scoped to what Bukkit's
  # public API can pre-compute (Fortune drops, melee/armor damage families, Mending's repair amount);
  # every other rune still procs the sound + particle even without a numeric effect. See docs/runesmith.md.
  resonance:
    min-level: 4
    chance: 0.15
    mend-bonus: 0.5
    sound: "minecraft:block.amethyst_block.chime"

crafting:
  # Detect ucucraft-items rose gold via its item-id PDC (soft dependency; no hard link).
  rose-gold:
    namespace: ucucraftitems
    key: item_id
    id-prefix: rose_gold
  # Non-masters are forced onto these when crafting iron armor: one ingot (I) is swapped for a
  # block (B) — "they tend to create shit". Blacksmiths keep the vanilla ingot recipes. Only pieces
  # listed here are gated; remove one and that piece stays vanilla for everyone. I = IRON_INGOT,
  # B = IRON_BLOCK.
  harder-recipes:
    iron_helmet:
      enabled: true
      result: { material: IRON_HELMET, amount: 1 }
      shape:
        - "IBI"
        - "I I"
        - "   "
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK
    iron_chestplate:
      enabled: true
      result: { material: IRON_CHESTPLATE, amount: 1 }
      shape:
        - "I I"
        - "IBI"
        - "III"
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK
    iron_leggings:
      enabled: true
      result: { material: IRON_LEGGINGS, amount: 1 }
      shape:
        - "IBI"
        - "I I"
        - "I I"
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK
    iron_boots:
      enabled: true
      result: { material: IRON_BOOTS, amount: 1 }
      shape:
        - "I I"
        - "IBI"
        - "   "
      ingredients:
        I: IRON_INGOT
        B: IRON_BLOCK

minigames:
  speed-typing:
    duration-seconds: 10
    words: [redstone, diamond, creeper, enchant, obsidian, netherite]
  speed-clicking:
    duration-seconds: 5
    target-clicks: 30
  rhythm:
    # A marker sweeps an on-screen bar; press SPACE when it's on the green target zone.
    beats: 8               # number of passes/rounds (also the forge's max "hits")
    marker-speed-ticks: 2  # ticks per marker step (lower = faster/harder)
    track-width: 21        # width of the bar in cells
    # Optional feedback sound on hit/miss (leave blank to disable). Purely visual otherwise.
    sound: "minecraft:block.note_block.pling"
  sequence-memory:
    start-length: 3
    max-length: 8
    show-ms: 600
